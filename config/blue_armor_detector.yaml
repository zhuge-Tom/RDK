blue_armor_detector:
  ros__parameters:
    input_topic: /image_raw

    # Defaults are translated from /home/RM_Vision on the RDK S100.
    hue_min: 90
    hue_max: 135
    saturation_min: 50
    value_min: 50
    gray_min: 110
    close_kernel_height: 7

    min_light_area: 150.0
    max_light_area: 80000.0
    min_light_aspect_ratio: 1.5
    min_light_height: 35
    min_light_width: 5
    max_light_height: 700
    max_light_width: 200
    min_blue_red_ratio: 1.05

    max_pair_height_ratio: 1.8
    max_pair_y_ratio: 0.8
    min_pair_x_ratio: 0.8
    max_pair_x_ratio: 5.0
    min_armor_aspect_ratio: 1.2
    max_armor_aspect_ratio: 5.5
